[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eidolon-ops"
version = "0.1.0"
description = "Unified macOS and Raspberry Pi lifecycle, deployment and path management for Eidolon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography>=45,<47",
  "supervisor>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.21",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.4",
]

[project.scripts]
eidolon-ops = "eidolon_ops.host_cli:run"
eidolon-lan-ingress = "eidolon_ops.lan_ingress:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eidolon_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: pure configuration and command construction",
  "component: isolated target filesystem or state-machine behavior",
  "contract: compatibility with the existing eidolon-release wire contract",
  "integration: real local subprocesses with fake SSH/SCP executables",
]

[tool.coverage.run]
branch = true
source = ["eidolon_ops"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
