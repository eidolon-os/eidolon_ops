[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eidolon-ops"
version = "0.1.0"
description = "Unified macOS and Raspberry Pi lifecycle, deployment and path management for Eidolon"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
  "cryptography>=45,<47",
  "eidolon-sdk",
  "jsonschema>=4.21",
  "supervisor>=4.2,<5",
]

[tool.uv.sources]
eidolon-sdk = { path = "../eidolon_sdk", editable = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.4",
  # Starlette's TestClient, which is how the console's HTTP contract is tested
  # without binding a port.
  "httpx2>=2",
]
# The workstation console. An extra rather than a dependency: the CLI is the
# entry point every Host operation goes through, and it must stay installable
# without a web server.
console = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
eidolon-ops = "eidolon_ops.host_cli:run"
eidolon-ops-console = "eidolon_ops.console.server:run"
eidolon-lan-ingress = "eidolon_ops.lan_ingress:main"
eidolon-device-management-gate = "eidolon_ops.device_management_gate:main"
eidolon-device-baseline = "eidolon_ops.device_baseline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eidolon_ops"]
# The console's built interface, when it has been built. Absent from a checkout
# that only ever drives the CLI.
artifacts = ["src/eidolon_ops/console/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: pure configuration and command construction",
  "console: the workstation console API and its run store",
  "component: isolated target filesystem or state-machine behavior",
  "contract: compatibility with the existing eidolon-release wire contract",
  "integration: real local subprocesses with fake SSH/SCP executables",
]

[tool.coverage.run]
branch = true
source = ["eidolon_ops"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
