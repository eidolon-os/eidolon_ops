; supervisord master config for the Eidolon dev stack.
;
; Ops owns this executor topology. Admin is a client of its XML-RPC socket.
;
; Enable / disable a sub-project = create / remove a symlink under
;   $EIDOLON_RUNTIME_ROOT/supervisor/enabled/<name>.conf
; The [include] glob below picks up whatever lives in enabled/.
;
; Start/stop ordering is encoded with [group:*] priority values in each
; available/*.conf. Lower priority groups are spawned first and stopped last,
; so infrastructure should use low numbers and leaf apps should use higher
; numbers.

[unix_http_server]
file=%(ENV_EIDOLON_RUNTIME_ROOT)s/ops/supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_EIDOLON_LOG_ROOT)s/ops/supervisord.log
pidfile=%(ENV_EIDOLON_RUNTIME_ROOT)s/ops/supervisord.pid
childlogdir=%(ENV_EIDOLON_LOG_ROOT)s/ops/childlogs
nodaemon=false
minfds=1024
minprocs=200
; ---- proxy isolation ----
; Two independent defenses, both required, applied to every spawned child
; (admin / hub / agent / channel / memory / livekit / nats / their workers).
;
; Defense 1 — clear HTTP_PROXY family.
;   Reason: aiohttp.ws_connect (used by livekit + channel-worker) reads env
;   proxy vars but does NOT honor NO_PROXY for ws:// URLs. So just setting
;   NO_PROXY isn't enough — we have to wipe the proxy vars themselves to
;   keep WebSocket traffic off any upstream tunnel.
;
; Defense 2 — set NO_PROXY=loopback explicitly.
;   Reason: httpx with default trust_env=True does TWO things when no env
;   proxy is set:
;     a. read HTTP_PROXY / HTTPS_PROXY env vars (we just cleared these), AND
;     b. on macOS, fall back to ``getproxies_macosx_sysconf()`` — the
;        system-wide proxy from System Settings → Network → Proxies
;        (commonly 127.0.0.1:7890 if the operator runs Clash / Mihomo /
;        ShadowSocks etc.).
;   That macOS fallback (b) silently routed admin's loopback MCP calls
;   through the user's system proxy, which then returned 502 "Bad Gateway,
;   Connection: close, Content-Length: 0" — the proxy's "can't reach
;   upstream" shape, NOT a real upstream error. NO_PROXY listing the
;   loopback addresses overrides (b) too: httpx sees the destination
;   matches NO_PROXY and skips proxy resolution entirely.
;
; The combination means every loopback HTTP call in the stack goes direct
; regardless of what the operator has configured in their shell or macOS
; preferences. External calls (LLM APIs etc.) are NOT covered here — if a
; sub-project needs to reach the outside, it sets its own proxy via its
; own .env file, which can have a non-empty HTTP_PROXY for that specific
; program (supervisord program-level env overrides this [supervisord]
; default).
environment=HTTP_PROXY="",HTTPS_PROXY="",ALL_PROXY="",http_proxy="",https_proxy="",all_proxy="",NO_PROXY="127.0.0.1,localhost,::1,*.local",no_proxy="127.0.0.1,localhost,::1,*.local"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_EIDOLON_RUNTIME_ROOT)s/ops/supervisor.sock

[include]
files=%(ENV_EIDOLON_ADMIN_SUPERVISOR_ENABLED_DIR)s/*.conf
