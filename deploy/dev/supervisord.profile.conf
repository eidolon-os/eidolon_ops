; supervisord master config for a run_all.sh supervisor profile.
;
; run_all.sh owns the profile variables:
;   EIDOLON_SUPERVISOR_PROFILE
;   EIDOLON_SUPERVISOR_SOCKET
;   EIDOLON_SUPERVISOR_PID
;   EIDOLON_SUPERVISOR_ENABLED_DIR
;   EIDOLON_SUPERVISOR_INCLUDE_GLOB
;
; The included program configs come from the Ops-owned available directory.

[unix_http_server]
file=%(ENV_EIDOLON_SUPERVISOR_SOCKET)s
chmod=0700

[supervisord]
logfile=%(ENV_EIDOLON_SUPERVISOR_LOG_FILE)s
pidfile=%(ENV_EIDOLON_SUPERVISOR_PID)s
childlogdir=%(ENV_EIDOLON_SUPERVISOR_CHILDLOG_DIR)s
nodaemon=false
minfds=1024
minprocs=200
environment=HTTP_PROXY="",HTTPS_PROXY="",ALL_PROXY="",http_proxy="",https_proxy="",all_proxy="",NO_PROXY="127.0.0.1,localhost,::1,*.local",no_proxy="127.0.0.1,localhost,::1,*.local",EIDOLON_ADMIN_SUPERVISOR_SOCKET="%(ENV_EIDOLON_SUPERVISOR_SOCKET)s",EIDOLON_ADMIN_SUPERVISOR_ENABLED_DIR="%(ENV_EIDOLON_SUPERVISOR_ENABLED_DIR)s"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_EIDOLON_SUPERVISOR_SOCKET)s

[include]
files=%(ENV_EIDOLON_SUPERVISOR_INCLUDE_GLOB)s
