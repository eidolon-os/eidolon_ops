; Commit-pinned macOS source profile mirroring the 15-unit Pi product topology,
; plus one explicitly controlled Admin Web development process. All generated
; env/settings paths are under EIDOLON_CONFIG_ROOT. Component working trees are
; selected by the reviewed Ops release matrix.

[program:bootstrapd]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh %(ENV_EIDOLON_SOURCE_ADMIN)s %(ENV_EIDOLON_PRODUCT_ENV_ROOT)s/bootstrap.env -- %(ENV_EIDOLON_SOURCE_ADMIN)s/.venv/bin/eidolon-bootstrapd
directory=%(ENV_EIDOLON_SOURCE_ADMIN)s
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/admin/bootstrapd.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/admin/bootstrapd.err.log
environment=PYTHONUNBUFFERED="1",EIDOLON_BOOTSTRAP_MODE="development"

[group:bootstrap]
priority=10
programs=bootstrapd

[program:local-api]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh %(ENV_EIDOLON_SOURCE_ADMIN)s %(ENV_EIDOLON_PRODUCT_ENV_ROOT)s/local-api.env -- %(ENV_EIDOLON_SOURCE_ADMIN)s/.venv/bin/eidolon-local-api
