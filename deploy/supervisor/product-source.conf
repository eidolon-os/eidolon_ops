environment=PYTHONUNBUFFERED="1",EIDOLON_BOOTSTRAP_MODE="development",EIDOLON_LOCAL_API_HOST="0.0.0.0",EIDOLON_LOCAL_API_PORT="9002"

[program:local-api-mdns]
command=/usr/bin/dns-sd -R "Eidolon Local API" _eidolon-local-api._tcp local 9002 contract=1 scheme=https
