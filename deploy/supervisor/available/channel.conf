; eidolon_channel — LiveKit voice agent worker.
;
; No HTTP / NATS surface from the worker itself. supervisord owns lifecycle;
; we surface status / logs through the admin UI's Supervisor + channel pages.
;
; with-env.sh loads config/.env (secrets + provider keys); structured fields
; (host/port/providers) come from config/settings.yaml at worker startup.

[program:channel-worker]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_channel
    config/.env
    --
    %(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/wait-tcp.sh
    --host
    127.0.0.1
    --port
    7880
    --timeout
    120
    --
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_channel/.venv/bin/python
    -m
    eidolon.livekit.agent.server
directory=%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_channel
priority=50
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=40
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/channel/worker.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/channel/worker.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1",EIDOLON_ENV="dev",LOG_DIR="%(ENV_EIDOLON_LOG_ROOT)s/channel"

[group:channel]
priority=160
programs=channel-worker
