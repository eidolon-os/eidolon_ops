; Kernel Device Mount authority. autostart is false because eidolond owns
; desired state; authority outages do not prevent the process from serving
; existing Mount reads.

[program:kernel-api]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_kernel
    %(ENV_EIDOLON_ADMIN_CONTROL_PLANE_ROOT)s/env/kernel.env
    --
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_kernel/.venv/bin/uvicorn
    eidolon_kernel.main:create_app
    --factory
    --host 127.0.0.1
    --port %(ENV_EIDOLON_KERNEL_API_PORT)s
directory=%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_kernel
autostart=false
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/kernel/api.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/kernel/api.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:kernel]
priority=110
programs=kernel-api
