; eidolond is the sole desired-state authority for Data/Hub/Kernel in this
; profile. supervisord remains only the host process executor.

[program:eidolond]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_kernel
    %(ENV_EIDOLON_ADMIN_CONTROL_PLANE_ROOT)s/env/eidolond.env
    --
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_kernel/.venv/bin/eidolond
directory=%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_kernel
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/kernel/eidolond.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/kernel/eidolond.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:eidolond]
priority=40
programs=eidolond
