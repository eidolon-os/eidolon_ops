; LiveKit server — shared infrastructure used by hub (room control plane) and
; channel (voice agent worker). Config and lifecycle are owned by Eidolon Ops.
; Credentials are generated once under EIDOLON_STATE_ROOT and inherited by
; LiveKit, Hub and Channel. They are never stored in this source config.

[program:livekit-server]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/livekit-dev.sh
directory=%(ENV_EIDOLON_OPS_ROOT)s
priority=10
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/livekit/server.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/livekit/server.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:livekit]
priority=20
programs=livekit-server
