; Isolated Admin profile. Secrets and directory transport are materialized under
; var/os-control-plane by the validated preparation command.

[program:admin-api]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh
    %(ENV_EIDOLON_ADMIN_ROOT)s
    %(ENV_EIDOLON_ADMIN_CONTROL_PLANE_ROOT)s/env/admin.env
    --
    %(ENV_EIDOLON_OPS_VENV)s/bin/uvicorn
    eidolon_admin_server.app.main:app
    --host %(ENV_EIDOLON_ADMIN_API_HOST)s
    --port %(ENV_EIDOLON_ADMIN_API_PORT)s
directory=%(ENV_EIDOLON_ADMIN_ROOT)s
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/admin/gateway-api.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/admin/gateway-api.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1",EIDOLON_ADMIN_API_URL="http://%(ENV_EIDOLON_ADMIN_API_HOST)s:%(ENV_EIDOLON_ADMIN_API_PORT)s"

[group:admin]
priority=50
programs=admin-api
