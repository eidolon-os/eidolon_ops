; Global audit query projection.
;
; This is infrastructure, not a business authority. Producers commit only to
; their local outbox and publish asynchronously to the dedicated JetStream
; stream. This worker is the sole writer of audit-index.sqlite3, so indexing
; and Mission Control query load never contend with a business SQLite writer.

[program:audit-indexer]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/wait-tcp.sh
    --host
    127.0.0.1
    --port
    4222
    --timeout
    60
    --
    %(ENV_EIDOLON_OPS_VENV)s/bin/python
    -m
    eidolon_admin_server.audit.cli
    --nats-url
    nats://127.0.0.1:4222
    --sqlite-path
    %(ENV_EIDOLON_STATE_ROOT)s/audit/audit-index.sqlite3
directory=%(ENV_EIDOLON_ADMIN_ROOT)s
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/audit/indexer.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/audit/indexer.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:audit]
priority=20
programs=audit-indexer
