; eidolon_client_web — Next.js dev server (port from config/ports.yaml).
;
; Browser-facing client that connects to hub's LiveKit room and hub's
; /api/config token endpoint. Pure frontend; no admin HTTP / NATS surface.
; supervisord just owns the lifecycle of `next dev`.
;
; Next.js auto-loads .env.local from the project cwd, so no with-env.sh
; wrapper is needed here. We bind explicitly to EIDOLON_CLIENT_WEB_PORT
; from config/ports.yaml. Keep it away from :3000 when that port is used
; by the official-site dev server or other standalone web projects.

[program:client-web]
command=%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_client_web/node_modules/.bin/next
    dev
    --port
    %(ENV_EIDOLON_CLIENT_WEB_PORT)s
directory=%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_client_web
autostart=true
autorestart=true
startsecs=4
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/client-web/dev.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/client-web/dev.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=NODE_ENV="development"

[group:client-web]
priority=200
programs=client-web
