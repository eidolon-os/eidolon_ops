; eidolon_hub — FastAPI; bind host/port from config/ports.yaml (EIDOLON_HUB_API_*).
;
; We deliberately do NOT supervise hub's legacy web clients here. Reason:
; this admin gateway provides the UI; those should be retired by hub or run
; standalone on their own ports.
;
; with-env.sh loads config/.env (LIVEKIT_API_KEY/SECRET only).

[program:hub-api]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_hub
    config/.env
    --
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_hub/.venv/bin/uvicorn
    hub.main:app
    --host %(ENV_EIDOLON_HUB_API_HOST)s
    --port %(ENV_EIDOLON_HUB_API_PORT)s
    --proxy-headers
    --forwarded-allow-ips=*
directory=%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_hub
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/hub/api.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/hub/api.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:hub]
priority=120
programs=hub-api
