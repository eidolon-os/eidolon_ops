; NATS server with JetStream — shared infrastructure for every Eidolon
; sub-project that publishes/subscribes on the local broker (memory, hub,
; future agent). Eidolon Ops is the only lifecycle authority on this host.
;
; Configuration values are defined in config/ports.yaml and exported as
; EIDOLON_NATS_* env vars before supervisord starts.

[program:nats-server]
command=%(ENV_EIDOLON_NATS_SERVER)s
    -js
    -sd %(ENV_EIDOLON_STATE_ROOT)s/nats/jetstream
    --port %(ENV_EIDOLON_NATS_PORT)s
    --http_port %(ENV_EIDOLON_NATS_HTTP_PORT)s
directory=%(ENV_EIDOLON_STATE_ROOT)s/nats
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/nats/server.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/nats/server.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:nats]
priority=10
programs=nats-server
