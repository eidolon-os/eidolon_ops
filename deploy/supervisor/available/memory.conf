; eidolon_memory — two long-running supervisord programs.
;
; memory-supervisor: in-process supervisor that spawns per-user children from
;   admin's user registry API — one eidolon-memory-agent per enabled user, and optionally
;   eidolon-memory-consolidator when consolidator.enabled is true (opt-in).
;   Child logs: $EIDOLON_LOG_ROOT/memory/agent_<user>.log and
;   consolidator_<user>.log (EIDOLON_MEMORY_LOG_DIR). Do not add a separate
;   supervisord program for consolidator; SIGHUP memory-supervisor reconciles.
;   stopwaitsecs (35s) covers the 30s grace before SIGKILL on agent children.
;
; memory-discovery: HTTP service; port from config/ports.yaml.

[program:memory-supervisor]
; with-env.sh → wait-tcp gate → eidolon-memory-supervisor.
; Phase 30.A: memory's bus client connects to nats:4222 inside its
; supervisor + per-user agent children. Without this gate, memory
; could spam connection errors at cold start until nats finished
; binding. Same two-wrapper chain channel-worker uses for LiveKit
; (config/env first, then port-wait, then exec).
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_memory
    config/.env
    --
    %(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/wait-tcp.sh
    --host
    127.0.0.1
    --port
    4222
    --timeout
    60
    --
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_memory/.venv/bin/eidolon-memory-supervisor
directory=%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_memory
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=35
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/memory/supervisor.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/memory/supervisor.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
; PATH must include memory's venv so the in-process supervisor can spawn
; `eidolon-memory-agent` and `eidolon-memory-consolidator` by bare command name.
; EIDOLON_MEMORY_LOG_DIR puts supervisor children's logs under
; $EIDOLON_LOG_ROOT/memory/ ({agent,consolidator}_<user_id>.log).
environment=PYTHONUNBUFFERED="1",PATH="%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_memory/.venv/bin:%(ENV_PATH)s",EIDOLON_MEMORY_LOG_DIR="%(ENV_EIDOLON_LOG_ROOT)s/memory",EIDOLON_ADMIN_API_URL="http://%(ENV_EIDOLON_ADMIN_API_HOST)s:%(ENV_EIDOLON_ADMIN_API_PORT)s"

[program:memory-discovery]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_memory
    config/.env
    --
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_memory/.venv/bin/eidolon-memory-discovery
    --host
    %(ENV_EIDOLON_MEMORY_DISCOVERY_HOST)s
    --port
    %(ENV_EIDOLON_MEMORY_DISCOVERY_PORT)s
directory=%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_memory
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/memory/discovery.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/memory/discovery.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:memory]
priority=100
programs=memory-supervisor,memory-discovery
