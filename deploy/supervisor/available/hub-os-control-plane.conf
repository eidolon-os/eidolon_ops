; Isolated Hub authority. autostart is false because eidolond owns desired state.

[program:hub-api]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_hub
    %(ENV_EIDOLON_ADMIN_CONTROL_PLANE_ROOT)s/env/hub.env
    --
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_hub/.venv/bin/uvicorn
    hub.main:app
    --host 127.0.0.1
    --port %(ENV_EIDOLON_HUB_API_PORT)s
directory=%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_hub
autostart=false
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/hub/api.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/hub/api.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:hub]
priority=100
programs=hub-api
