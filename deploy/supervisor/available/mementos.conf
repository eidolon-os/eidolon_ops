; Mementos — Electron-vite dev process running outside this repo.
;
; Phase 31.A: admin supervises a side-project's ``npm run dev`` so it
; can be started from the Supervisor UI. The Electron main process owns
; a Python sidecar at :18765 (see memento_s_test/README).
;
; Keep autostart disabled because operators often run the Mementos
; project standalone while developing it; cold-starting it here would
; occupy :18765 and prevent that checkout from booting.
;
; **Phase 32.B fixup**: bare ``command=npm run dev`` orphaned Electron
; + Python sidecar on supervisord stop because npm does not forward
; SIGTERM to its child shell. Even with ``stopasgroup`` the kill never
; reached the Electron PID. Fix is to bypass npm by invoking
; ``electron-vite dev`` directly — npm is still useful for install +
; build, but for ``run dev`` it's just a 50ms signal-eating shim. The
; binary lives at ``$EIDOLON_MEMENTOS_DIR/node_modules/.bin/electron-
; vite`` after ``npm install``.
;
; **Phase 33.A8 cleanup**: dropped the historical ``bash -c 'cd … &&
; exec …'`` wrapper. supervisord's own ``command=`` doesn't go through
; a shell — it forks + execvp's directly with ``directory=`` set as
; cwd — so the bash interposition was redundant the moment npm was
; removed. supervisord IS the parent now; stopasgroup tags Electron's
; PGID without indirection.
;
; Source directory is parameterized via EIDOLON_MEMENTOS_DIR (exported
; by ports.py from config/ports.yaml's ``mementos.source_dir``). On
; machines without the mementos checkout, leave that block commented
; in ports.yaml and disable the symlink in deploy/supervisor/enabled/.
;
; PATH: macOS supervisord starts in a minimal env; node (which the
; electron-vite shebang resolves via env) lives under /opt/homebrew/bin
; (Apple Silicon) or /usr/local/bin (Intel). We prepend both so this
; works on either host without hard-coding. Operators with a different
; node manager (nvm, asdf) need to symlink node somewhere in this PATH.

[program:mementos]
; Direct exec — supervisord forks + execvp's; ``directory=`` is cwd.
; Electron-vite reads ``electron.vite.config.ts`` from cwd, which is
; mementos' source dir, so the launch is equivalent to the operator
; typing ``./node_modules/.bin/electron-vite dev`` in that directory.
command=%(ENV_EIDOLON_MEMENTOS_DIR)s/node_modules/.bin/electron-vite dev
directory=%(ENV_EIDOLON_MEMENTOS_DIR)s
autostart=false
autorestart=true
; electron-vite dev + Electron window boot + Python sidecar startup
; typically completes within 10-20s on a warm cache. Give a generous
; window — failing fast hides a real boot bug, not a feature.
startsecs=15
stopsignal=TERM
; SIGTERM the whole process group so the Python sidecar dies with
; Electron. The supervised PID IS the electron-vite root (no bash /
; npm in between) → kill -PG actually catches Electron + the Python
; sidecar it spawned.
stopasgroup=true
killasgroup=true
; Electron's quit handler needs a beat to close windows + tear down
; child processes; 30s is comfortable above its 5-10s typical.
stopwaitsecs=30
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/mementos/main.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/mementos/main.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:%(ENV_PATH)s"

[group:mementos]
; Independent side project — order doesn't matter relative to the rest
; of the stack, mementos doesn't depend on NATS or LiveKit. Slot after
; channel (160) and before client-web (200) so ``status`` lists it
; sensibly grouped with the leaf services.
priority=170
programs=mementos
