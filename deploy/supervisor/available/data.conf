; Data V2 authority. autostart is false because eidolond owns desired state.

[program:data-api]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_data
    %(ENV_EIDOLON_ADMIN_CONTROL_PLANE_ROOT)s/env/data.env
    --
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_data/.venv/bin/uvicorn
    eidolon_data.api.companion_authority:create_app
    --factory
    --host 127.0.0.1
    --port %(ENV_EIDOLON_DATA_API_PORT)s
directory=%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_data
autostart=false
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/data/api.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/data/api.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[program:data-workspace-api]
command=%(ENV_EIDOLON_OPS_ROOT)s/deploy/supervisor/wrappers/with-env.sh
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_data
    %(ENV_EIDOLON_ADMIN_CONTROL_PLANE_ROOT)s/env/data.env
    --
    %(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_data/.venv/bin/uvicorn
    eidolon_data.api.workspace_authority:create_app
    --factory
    --host 127.0.0.1
    --port %(ENV_EIDOLON_DATA_WORKSPACE_API_PORT)s
directory=%(ENV_EIDOLON_WORKSPACE_ROOT)s/eidolon_data
autostart=false
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_EIDOLON_LOG_ROOT)s/data/workspace-api.log
stderr_logfile=%(ENV_EIDOLON_LOG_ROOT)s/data/workspace-api.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:data]
priority=90
programs=data-api,data-workspace-api
