schema_version = 1

[foundation]
profile = "raspberry-pi-os-debian-arm64-v2"

[host]
user = "eidolon-pi5"
hostname = "192.168.100.15"
port = 22
identity_file = "/absolute/path/to/id_ed25519_eidolon_pi"
known_hosts_file = "/absolute/path/to/eidolon_pi_known_hosts"
connect_timeout_seconds = 10
remote_uv = "/usr/local/bin/uv"

[workspace]
bundle_root = "/private/tmp/eidolon-release-bundles"
release_cli = "../../eidolon_kernel/.venv/bin/eidolon-release"

[sources.eidolon_kernel]
path = "../../eidolon_kernel"
revision = "267d5dad38e2c2a83d56f0f8e2bf6fb42897fb61"

[sources.eidolon_data]
path = "../../eidolon_data"
revision = "d81086e2807f44ca0c0e43e31103cd85e6165a46"

[sources.eidolon_hub]
path = "../../eidolon_hub"
revision = "4bab6a0c5201c6adda7ba0f68241297034326cae"

[sources.eidolon_admin]
path = "../../eidolon_admin"
revision = "987c69282a5a91361b0e9d20144bb7163b8241b3"

[sources.eidolon_agent]
path = "../../eidolon_agent"
revision = "309ba573f249f9376275e14a5cc2f5ea1049b022"

[sources.eidolon_channel]
path = "../../eidolon_channel"
revision = "8843de6c1268bf01bf8e303ce26fb209df3e033b"

[sources.eidolon_memory]
path = "../../eidolon_memory"
revision = "303b6004c58abbf86eb311de1f4002748fa9457d"

[sources.eidolon_sdk]
path = "../../eidolon_sdk"
revision = "8108970514d9fefd3d93e7466e91706a1681c331"

[services]
units = [
  "eidolon-bootstrapd.service",
  "eidolond.service",
  "eidolon-data.service",
  "eidolon-data-workspace.service",
  "eidolon-hub.service",
  "eidolon-kernel.service",
  "eidolon-local-api.service",
  "eidolon-admin.service",
  "eidolon-nats.service",
  "eidolon-livekit.service",
  "eidolon-memory-supervisor.service",
  "eidolon-memory-discovery.service",
  "eidolon-agent.service",
  "eidolon-channel-provider.service",
  "eidolon-channel.service",
]

[data]
system_database = "/var/lib/eidolon/eidolon-system.sqlite3"
object_store = "/var/lib/eidolon/objects"
bootstrap_database = "/var/lib/eidolon-bootstrap/bootstrap.sqlite3"
deployment_evidence = "/var/lib/eidolon/deployments"

# Values stay in local mode-0600 files. The CLI copies bytes through a private
# staging directory and removes that staging directory after every attempt.
[install.files]
data_env = "/absolute/private/path/data.env"
hub_env = "/absolute/private/path/hub.env"
kernel_env = "/absolute/private/path/kernel.env"
admin_env = "/absolute/private/path/admin.env"
local_api_env = "/absolute/private/path/local-api.env"
bootstrap_env = "/absolute/private/path/bootstrap.env"
host_identity = "/absolute/private/path/host_identity.ed25519"
agent_env = "/absolute/private/path/agent.env"
channel_env = "/absolute/private/path/channel.env"
memory_env = "/absolute/private/path/memory.env"
livekit_env = "/absolute/private/path/livekit.env"
agent_settings = "/absolute/private/path/agent.yaml"
channel_settings = "/absolute/private/path/channel.yaml"
memory_settings = "/absolute/private/path/memory.yaml"
