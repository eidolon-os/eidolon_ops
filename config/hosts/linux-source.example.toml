schema_version = 1

[host]
id = "linux-source"
platform = "linux"

[execution]
transport = "local"
supervisor = "supervisord"
packages = "none"
identity = "current-user"

[paths]
# Code stays in the multi-repository workspace. Generated configuration,
# credentials, state, runtime files, logs and caches are contained under one
# ignored workspace-local product root instead of being written into sibling
# repositories or the historical ~/eidolon namespace.
install_root = "~/ai/eidolon"
current_root = "~/ai/eidolon"
config_root = "~/ai/eidolon/.eidolon/source-host/config"
state_root = "~/ai/eidolon/.eidolon/source-host/state"
runtime_root = "~/ai/eidolon/.eidolon/source-host/run"
log_root = "~/ai/eidolon/.eidolon/source-host/logs"
cache_root = "~/ai/eidolon/.eidolon/source-host/cache"
bootstrap_state_root = "~/ai/eidolon/.eidolon/source-host/bootstrap/state"
bootstrap_runtime_root = "~/ai/eidolon/.eidolon/source-host/bootstrap/run"

[adapter]
lifecycle_script = "../../deploy/dev/run_all.sh"
operations_config = "../eidolon-pi.toml"
# The operator supplies NATS and LiveKit binaries. This Host owns their lifecycle;
# startup never installs dependencies or requests administrator access.
foundation_mode = "external"
external_livekit_config = "~/ai/eidolon/.eidolon/source-host/run/livekit/livekit.generated.yaml"

[app]
# lan_ipv4 is optional. Leave it out and the Host reports the address it
# currently answers on; declare it only for a statically addressed Host.
# A discovered address forbids a literal one in livekit_client_url, which
# would go stale the same way.
# Static deployment override only:
# lan_ipv4 = "192.168.1.25"
hub_https_port = 8443
allow_insecure_livekit = true

# A source Host may point one source somewhere else without changing the Pi
# release matrix — at a frozen copy, or at a separate worktree. `path` is the
# point of this block; `revision` is optional and, because a source run
# executes the worktree rather than an archive of it, a revision written here
# must be that worktree's own HEAD. Keep the block disabled unless an override
# exists.
# [source_overrides.eidolon_admin]
# path = "/absolute/path/to/eidolon_admin-worktree"
# revision = "0000000000000000000000000000000000000000"


# Model placement is a Host capability, independent of OS and execution mode.
[capabilities]
provides = []

# Replace with this Host's actual provider endpoints before starting.
[model_endpoints]
laya_smart_home = "https://smart-home-model.example.invalid"
laya_participation = "https://models.example.invalid/v1/participation/decide"
