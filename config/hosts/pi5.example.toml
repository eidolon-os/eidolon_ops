schema_version = 1

[host]
id = "eidolon-pi5"
platform = "raspberry-pi"
driver = "ssh-systemd"

[paths]
install_root = "/opt/eidolon"
current_root = "/opt/eidolon/current"
config_root = "/etc/eidolon"
state_root = "/var/lib/eidolon"
runtime_root = "/run/eidolon"
log_root = "/var/log/eidolon"
cache_root = "/var/cache/eidolon"
bootstrap_state_root = "/var/lib/eidolon-bootstrap"
bootstrap_runtime_root = "/run/eidolon-bootstrap"

[adapter]
operations_config = "../eidolon-pi.toml"

[app]
# lan_ipv4 is optional; without it the Host reports the address on its
# default route, so a DHCP lease change does not stale the profile.
lan_ipv4 = "192.168.100.15"
hub_https_port = 8443
allow_insecure_livekit = true
# Development HIL only. The named file must be an absolute, mode-0600,
# non-symlink registry; leaving this unset keeps manufacturer-p256 fail-closed.
# Optional. Names the Setup code `commissioning-code` signs instead of letting
# the Host draw one, so a development loop never has to look a code up: the
# command becomes one you fire without reading its output, and the digits typed
# on the phone are the same every time. Only the value is pinned — the Host
# still opens one ordinary session for it, which expires, is spent once, dies
# after five wrong tries and supersedes any window before it. It must be a code
# the Host would have drawn: eight digits, not all the same, and not the plain
# run up or down. A shipped Host would name the code printed on its own box
# here instead, which is why nothing on this path looks at the build mode.
# 值不写在这里：这些 profile 是入库的，而入库文件里的码就是所有人都有的码。
# 只写路径，值放到运维自己的输入目录（`.eidolon-ops/` 一直是 gitignore 的），
# 和这台主机安装时用的其他每一个 secret 在一起。
# setup_code_file = "../../.eidolon-ops/pi5/inputs/factory_setup_code"
