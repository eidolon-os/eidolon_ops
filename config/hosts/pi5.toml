schema_version = 1

[host]
id = "eidolon-pi5"
platform = "raspberry-pi"
driver = "ssh-systemd"

[paths]
install_root = "/opt/eidolon"
current_root = "/opt/eidolon/current"
config_root = "/etc/eidolon"
state_root = "/var/lib/eidolon"
runtime_root = "/run/eidolon"
log_root = "/var/log/eidolon"
cache_root = "/var/cache/eidolon"
bootstrap_state_root = "/var/lib/eidolon-bootstrap"
bootstrap_runtime_root = "/run/eidolon-bootstrap"

[adapter]
operations_config = "../eidolon-pi.toml"

[app]
hub_https_port = 9443
allow_insecure_livekit = true
# HIL only: the development commissioning registry this Pi installs. Each entry
# binds one board's stable hardware lookup id to the setup secret its firmware
# was built with, and states nothing else — the Hub derives that board's
# permanent hardware identity from the lookup id, so the file cannot claim a
# board type it has no way to prove. Without the file Hub loads the rejecting
# verifier and no device can enroll at all — which is a silent state, because
# nothing else about the Host looks unhealthy.

# Development loop only. Pinning the value is what removes the step: the
# operator never looks a code up, so `commissioning-code` becomes a command you
# fire without reading its output and the digits typed on the phone are the
# same every time. Only the value is pinned — the Host still opens one ordinary
# session for it, which expires, is spent once, dies after five wrong tries and
# supersedes any window before it. A shipped Host would name the code printed
# on its own box here instead, which is why there is no mode check anywhere on
# this path.
# 2026-09-08：值移到运维自己的输入目录里了。这个文件现在是入库的，而这个仓库
# 自己的原则是"入库文件里的码就是所有人都有的码"。所以这里只写路径，值和这台
# 主机安装时用的其他每一个 secret 放在一起（`.eidolon-ops/` 一直是 gitignore
# 的）。新 checkout 上这个文件不存在，install 会明确报出来——和另外 14 个
# install 输入的行为一致。
setup_code_file = "../../.eidolon-ops/pi5/inputs/factory_setup_code"

# This board has no NPU and runs no local model: its Laya calls go to wherever the
# model endpoints say (none yet), and the Laya unit and weights are not installed.
[capabilities]
provides = []

# Where this board's callers reach the models it does not run. Placeholder until the remote
# service exists: nothing on this board answers it, so IP-team decisions are unavailable and
# the Agent ends the round (home commands use the rules unless smarthome.interpreter is laya).
# Point both at the remote (https) when there is one.
[model_endpoints]
laya_smart_home = "http://127.0.0.1:8771"
laya_participation = "http://127.0.0.1:8773/v1/participation/decide"
