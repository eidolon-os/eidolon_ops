schema_version = 1

[host]
id = "mac-dev"
platform = "macos"
# The workstation's own end of the cable it strings to a board. The board
# declares this network in its operations config so it stops publishing
# 10.42.0.2; this says the same thing about 10.42.0.1, which is this machine.
# Two Hosts each describing their own publishing, not one fact written twice.
#
# Nobody had told this one. It runs Hub, Channel and Admin like any Host, and
# `_both` in the readiness contract says so — so until this line existed it
# offered phones and devices an address only it can reach, which is the whole
# of what happened on 2026-09-15 on a board that had been told.
management_networks = ["10.42.0.0/24"]

[execution]
transport = "local"
supervisor = "supervisord"
packages = "none"
identity = "current-user"

[paths]
install_root = "~/ai/eidolon"
current_root = "~/ai/eidolon"
config_root = "~/ai/eidolon/.eidolon/mac-product/config"
state_root = "~/ai/eidolon/.eidolon/mac-product/state"
runtime_root = "~/ai/eidolon/.eidolon/mac-product/run"
log_root = "~/ai/eidolon/.eidolon/mac-product/logs"
cache_root = "~/ai/eidolon/.eidolon/mac-product/cache"
bootstrap_state_root = "~/ai/eidolon/.eidolon/mac-product/bootstrap/state"
bootstrap_runtime_root = "~/ai/eidolon/.eidolon/mac-product/bootstrap/run"

[adapter]
lifecycle_script = "../../../.eidolon/mac-product/sources/main-20261031-6b5346e7/eidolon_ops/deploy/dev/run_all.sh"
operations_config = "../eidolon-pi.toml"
foundation_mode = "external"
external_livekit_config = "~/ai/eidolon/.eidolon/mac-product/run/livekit/livekit.generated.yaml"

[app]
# Local development input; retained across starts and delivered to bootstrapd.
setup_code_file = "../../.eidolon-ops/mac/inputs/factory_setup_code"
hub_https_port = 8443
allow_insecure_livekit = true
# One release set: every source below is a detached worktree of a commit on
# its repository's main, all under one snapshot root, so editable SDK, Data
# and Memory contracts dependencies resolve inside that root and every process
# imports the same revision. Data runs from the root too, not from its
# development checkout. Select the next set with `./eidolon mac release-set`,
# which writes the paths below and the lifecycle script; prepare refuses a
# hand-edited spread, a commit off main, or one that drops the last set's work.

[source_overrides.eidolon_data]
path = "../../../.eidolon/mac-product/sources/main-20261031-6b5346e7/eidolon_data"
revision = "ed8b888a3d8491816a80d9baf28902fce9a25f4d"

[source_overrides.eidolon_sdk]
path = "../../../.eidolon/mac-product/sources/main-20261031-6b5346e7/eidolon_sdk"
revision = "f40c19f641b83f120e0e13b35752039ac50f6eb2"

[source_overrides.eidolon_admin]
path = "../../../.eidolon/mac-product/sources/main-20261031-6b5346e7/eidolon_admin"
revision = "39c0228aedb4473b3bc37402c8de7b5899358057"

[source_overrides.eidolon_kernel]
path = "../../../.eidolon/mac-product/sources/main-20261031-6b5346e7/eidolon_kernel"
revision = "1d7deaf2ff6d109b4782af16adae3896e862df3d"

[source_overrides.eidolon_hub]
path = "../../../.eidolon/mac-product/sources/main-20261031-6b5346e7/eidolon_hub"
revision = "480e69747210ee15106961339d5c2054509cda35"

[source_overrides.eidolon_agent]
path = "../../../.eidolon/mac-product/sources/main-20261031-6b5346e7/eidolon_agent"
revision = "6b59730647f76b7ac7dd9560926c78f0e57673d0"

[source_overrides.eidolon_channel]
path = "../../../.eidolon/mac-product/sources/main-20261031-6b5346e7/eidolon_channel"
revision = "ab2a1670a458d79c722860a0a599385cc2a0b181"

[source_overrides.eidolon_memory]
path = "../../../.eidolon/mac-product/sources/main-20261031-6b5346e7/eidolon_memory"
revision = "70e4b5db1b4953da8dfe86ee562235f25e3e803e"

# Keep this Host's existing runtime selection explicit. Adding reviewed product
# capabilities must not start a new model on the workstation implicitly.
[source_overrides.eidolon_models]
path = "../../../.eidolon/mac-product/sources/main-20261031-6b5346e7/eidolon_models"
revision = "fa3af3221c964d12b11c248131c3609d387ed459"

[capabilities]
# Channel Provider owns the shared CPU speaker extractor; no extra daemon.
provides = ["local_laya", "local_speaker_verification", "local_laya_participation"]

# The Mac source run interprets home commands with Laya (its own MPS service; the address
# follows from local_laya) and records every interpretation for offline evaluation. A product
# Host does neither unless its own configuration says so.
[[settings.overlay]]
document = "agent.yaml"
path = "smarthome.interpreter"
value = "laya"

[[settings.overlay]]
document = "agent.yaml"
path = "smarthome.interpretation_record_path"
value = "$EIDOLON_STATE_ROOT/agent/smarthome/interpretation.jsonl"

# The Mac source run also assembles the 周边好生活 adapter (demo against its cloud
# mock, or the platform's test environment once it exists) and the Home
# Assistant adapter (against the HA Core bench in deploy/dev/homeassistant, or a
# real instance). Credentials never live here: the phone binds the account and
# Hub keeps them in its vault (EIDOLON_HUB_VAULT_KEY in hub.env).
[[settings.overlay]]
document = "hub.yaml"
path = "smarthome.providers"
value = "virtual,zhoubian,homeassistant"

# Use the shared SystemOne implementation for interrupt intent, as on Pi5.
[[settings.overlay]]
document = "channel.yaml"
path = "turn_policy.interrupt.intent_provider"
value = "systemone"

[[settings.overlay]]
document = "channel.yaml"
path = "turn_policy.interrupt.systemone.endpoint"
value = "http://decider.yangtzeailab.com/d3/v1/systemone"

[[settings.overlay]]
document = "channel.yaml"
path = "turn_policy.interrupt.systemone.model"
value = "d3"

# Measured local enrolled-audio inference: 327-348 ms. Recognition starts at
# final ASR evidence; bound the remaining wait without queuing late results.

# Remote participation is explicitly authorized for this Host acceptance.
# Ops owns the existing Models participation service; no HIL process dependency.
[participation]
upstream_url = "http://decider.yangtzeailab.com/d3/v1/systemone"
