schema_version = 1

[host]
id = "mac-dev"
platform = "macos"
driver = "local-supervisord"

[paths]
# Code is a working tree on macOS. Runtime data stays in the existing
# ~/eidolon namespace, but every lifetime has one explicit sub-root.
install_root = "~/ai/eidolon"
current_root = "~/ai/eidolon"
config_root = "~/ai/eidolon/eidolon_ops/config"
state_root = "~/eidolon/data"
runtime_root = "~/eidolon/run"
log_root = "~/eidolon/logs"
cache_root = "~/eidolon/cache"
bootstrap_state_root = "~/eidolon/bootstrap"
bootstrap_runtime_root = "~/eidolon/run/bootstrap"

[adapter]
lifecycle_script = "../../deploy/dev/run_all.sh"
