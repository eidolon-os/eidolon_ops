schema_version = 1

[host]
id = "mac-dev"
platform = "macos"
driver = "local-supervisord"

[paths]
# Code stays in the multi-repository workspace. Generated configuration,
# credentials, state, runtime files, logs and caches are contained under one
# ignored workspace-local product root instead of being written into sibling
# repositories or the historical ~/eidolon namespace.
install_root = "~/ai/eidolon"
current_root = "~/ai/eidolon"
config_root = "~/ai/eidolon/.eidolon/mac-product/config"
state_root = "~/ai/eidolon/.eidolon/mac-product/state"
runtime_root = "~/ai/eidolon/.eidolon/mac-product/run"
log_root = "~/ai/eidolon/.eidolon/mac-product/logs"
cache_root = "~/ai/eidolon/.eidolon/mac-product/cache"
bootstrap_state_root = "~/ai/eidolon/.eidolon/mac-product/bootstrap/state"
bootstrap_runtime_root = "~/ai/eidolon/.eidolon/mac-product/bootstrap/run"

[adapter]
lifecycle_script = "../../deploy/dev/run_all.sh"
operations_config = "../eidolon-pi.toml"
# Mac reuses the already-running NATS/LiveKit after health and
# credential-coherence checks; Ops owns the remaining source services.
foundation_mode = "external"
external_livekit_config = "../../../eidolon_admin/var/livekit/livekit.generated.yaml"

[app]
lan_ipv4 = "192.168.1.25"
hub_https_port = 8443
livekit_client_url = "ws://192.168.1.25:7880"
allow_insecure_livekit = true

# A Mac Host may run one reviewed source worktree without changing the Pi
# release matrix. Both fields are required and the worktree must be clean at
# the exact 40-hex commit. Keep this block disabled unless an override exists.
# [source_overrides.eidolon_admin]
# path = "/absolute/path/to/eidolon_admin-worktree"
# revision = "0000000000000000000000000000000000000000"
