schema_version = 1

[foundation]
profile = "ubuntu-2604-rk3588-arm64-v1"

[host]
user = "eidolon-opi5max"
# The Host's name, not one of its addresses: it answers here over whichever
# link is up, and Ops picks the best one that responds — the wire first, which
# measured 100 MB/s against 3.9 MB/s over Wi-Fi. Neither end configures a
# subnet: both self-assign into 169.254/16 when the cable is in, and the Pi's
# "eidolon-wired" profile is never-default so Wi-Fi keeps the route out.
# 名字，不是地址。板子自分配 link-local 并用 avahi 广播这个名字，ops 用
# getaddrinfo 解析它，并对 link-local 端点绑定接口（endpoints.py 写了为什么必须
# 绑）。换板子不用改这一行，工作站上也不用改任何东西。
#
# 这里曾经是 10.42.0.2，一个配置出来的常量，理由在当时成立：bring-up 没有声明这
# 个平台（PLATFORMS 里只有 Pi），于是板子的有线口只能手配，而手配的结果必然是静
# 态地址——工作站也得配成同网段，换板子要两头一起改。补上那个声明之后，这条理由
# 连同它带来的每一处对齐都没了。
hostname = "eidolon-opi5max.local"
port = 22
# This machine's own private key — the only value here that is machine-local.
identity_file = "~/.ssh/id_ed25519_eidolon_opi5max"
# And, separately, which operators the board accepts. Tracked; see its header.
operator_keys_file = "eidolon-rk3588.operators"
# The profile's own, not the operator's. Trust is granted under the Host's name
# (`HostKeyAlias`), which above is the cable's address — and every board flashed
# for this bench answers at that same address. So this name is the one place two
# different boards are told apart, and in `~/.ssh/known_hosts` that made a board
# swap an untracked hand edit sitting among a hundred unrelated hosts, where
# deleting the wrong line fails loudly and pasting an unverified key fails
# silently and forever. Here it is `trust-host-key`, which shows the fingerprint
# and makes replacing a different one an acknowledged act. The directory is
# gitignored, so the file stays machine-local; only its location is reviewed.
known_hosts_file = "../.eidolon-ops/opi5max/known_hosts"
connect_timeout_seconds = 10
remote_uv = "/usr/local/bin/uv"
# Release payloads must never fall back to Wi-Fi, where this workstation's VPN
# accounts for the transfer. Status and maintenance commands remain reachable.
require_wired_release_upload = true
# No `management_networks` here any more, and that is the point of the line
# above. It existed because this cable carried a routable subnet — 10.42.0.0/24
# looked to the board exactly like the product LAN, so the Hub, the Channel
# provider and Admin each published the workstation's address to devices, and
# on 2026-09-15 BOX-3 took it and spent the evening retrying a connection to an
# address no device can route to.
#
# A self-assigned 169.254/16 needs no such declaration: it is filtered as
# link-local everywhere that matters, by every one of those services, without
# being told. Naming the board rather than addressing it removed the subnet,
# and removing the subnet removed the thing that had to be declared about it.
#
# 2026-09-16。开发台架：claim 窗口常开，Setup code 单独即可添加 Host Admin。
# 这台机器证明"人持有它"的每条路——commissioning-code、controller-reset——都要走
# 这台工作站，所以管理手机一丢，台架就把自己锁在外面；而这块板子正是 mobile 和
# BOX-3 接着的那台。出厂的 Host 不写这一行，那时产品规则（ADR-0007）就是对的那条。
claim_window = "always_open"

[workspace]
# 2026-08-25: moved off /private/tmp. macOS purges it on its own schedule.
# This directory holds in-flight outputs for --resume; successful install and
# activation remove their output, and later successes sweep failures older than
# 48 hours. The reusable uv cache lives under the durable toolchain root.
bundle_root = "~/eidolon/release-bundles"
release_cli = "../../eidolon_kernel/.venv/bin/eidolon-release"
python_index_url = "https://pypi.org/simple"
python_http_timeout_seconds = 120
python_http_retries = 8
# Two streams made a cold fetch of the whole dependency set take longer than
# the bundle step's own ceiling. Only genuinely new dependencies reach the
# index now, but there is no reason to crawl through those either.
python_concurrent_downloads = 8

# No `revision` here on purpose. A release is defined by what the
# repositories hold; a written pin was a second copy of that fact, and the
# two were not equal — a cross-repository change was tested on every HEAD,
# deploy reported success, and the board went on running the commits in this
# file. To reproduce a combination that already shipped, pass
# `--revision source=<40hex>` for that run, which says so out loud.
[sources.eidolon_kernel]
path = "../../eidolon_kernel"

[sources.eidolon_data]
path = "../../eidolon_data"

[sources.eidolon_hub]
path = "../../eidolon_hub"

[sources.eidolon_admin]
path = "../../eidolon_admin"

[sources.eidolon_agent]
path = "../../eidolon_agent"

[sources.eidolon_channel]
path = "../../eidolon_channel"

[sources.eidolon_memory]
path = "../../eidolon_memory"

[sources.eidolon_models]
path = "../../eidolon_models"

[sources.eidolon_sdk]
path = "../../eidolon_sdk"

[services]
units = [
  "eidolon-bootstrapd.service",
  "eidolond.service",
  "eidolon-unit-applier.socket",
  "eidolon-unit-applier.service",
  "eidolon-data.service",
  "eidolon-data-workspace.service",
  "eidolon-hub.service",
  "eidolon-kernel.service",
  "eidolon-local-api.service",
  "eidolon-lifecycle-workflow.service",
  "eidolon-admin.service",
  "eidolon-nats.service",
  "eidolon-livekit.service",
  "eidolon-memory-embedder.service",
  "eidolon-memory-supervisor.service",
  "eidolon-memory-discovery.service",
  "eidolon-agent.service",
  "eidolon-channel-provider.service",
  "eidolon-channel.service",
  "eidolon-asr.service",
  "eidolon-llm.service",
  "eidolon-tts.service",
]

[data]
system_database = "/var/lib/eidolon/eidolon-system.sqlite3"
object_store = "/var/lib/eidolon/objects"
bootstrap_database = "/var/lib/eidolon-bootstrap/bootstrap.sqlite3"
deployment_evidence = "/var/lib/eidolon/deployments"

[install.files]
data_env = "../.eidolon-ops/opi5max/inputs/data.env"
hub_env = "../.eidolon-ops/opi5max/inputs/hub.env"
kernel_env = "../.eidolon-ops/opi5max/inputs/kernel.env"
admin_env = "../.eidolon-ops/opi5max/inputs/admin.env"
local_api_env = "../.eidolon-ops/opi5max/inputs/local-api.env"
bootstrap_env = "../.eidolon-ops/opi5max/inputs/bootstrap.env"
host_identity = "../.eidolon-ops/opi5max/inputs/host_identity.ed25519"
agent_env = "../.eidolon-ops/opi5max/inputs/agent.env"
channel_env = "../.eidolon-ops/opi5max/inputs/channel.env"
memory_env = "../.eidolon-ops/opi5max/inputs/memory.env"
livekit_env = "../.eidolon-ops/opi5max/inputs/livekit.env"
agent_settings = "../.eidolon-ops/opi5max/inputs/agent.yaml"
channel_settings = "../.eidolon-ops/opi5max/inputs/channel.yaml"
memory_settings = "../.eidolon-ops/opi5max/inputs/memory.yaml"

# Installed local model capabilities remain available for comparison; this
# profile routes ASR, TTS and every configured LLM to cloud providers.
# The previous local routing is backed up beside this file.
[capabilities]
provides = ["rknpu2", "local_asr", "local_llm", "local_tts"]

[[settings.overlay]]
document = "channel.yaml"
path = "providers.stt_provider"
value = "bailian"

[[settings.overlay]]
document = "channel.yaml"
path = "providers.tts_provider"
value = "bailian"

# Keep the standard Agent RPC route. Both Channel's direct LLM settings and
# Agent's serving model use DeepSeek; API keys remain in private inputs.
[[settings.overlay]]
document = "channel.yaml"
path = "llm.base_url"
value = "https://api.deepseek.com"

[[settings.overlay]]
document = "channel.yaml"
path = "llm.model"
value = "deepseek-v4-flash"

[[settings.overlay]]
document = "agent.yaml"
path = "llm.models[0].name"
value = "openai/deepseek-v4-flash"

# api_base inherits https://api.deepseek.com/v1 from Agent's pinned settings.
# Removing the local address override restores its existing cloud endpoint.
[[settings.overlay]]
document = "agent.yaml"
path = "llm.default_model"
value = "openai/deepseek-v4-flash"

[[settings.overlay]]
document = "memory.yaml"
path = "llm.model"
value = "openai/deepseek-v4-flash"

[[settings.overlay]]
document = "memory.yaml"
path = "llm.base_url"
value = "https://api.deepseek.com/v1"
